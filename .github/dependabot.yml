# Set update schedule for GitHub Actions

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
        - "*"
    # Explicit, so Actions bumps don't copy the fix prefix of the last runtime bump.
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
    # Include transitive dependencies (e.g. urllib3, certifi): the Docker image installs uv.lock as is.
    - dependency-type: "all"
    groups:
      all:
        patterns:
        - "*"
      # Without this, each vulnerable dependency gets its own security PR.
      security:
        applies-to: security-updates
        patterns:
        - "*"
    # fix(deps) for runtime deps so release-please cuts a patch release; dev-only bumps stay chore(deps-dev).
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  # Weekly, as the wolfi-base digest carries the OS CVE fixes.
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
        - "*"
    commit-message:
      prefix: "fix"
      include: "scope"
